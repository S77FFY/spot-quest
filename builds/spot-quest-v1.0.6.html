<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="app-repo" content="spot-quest">
<meta name="app-version" content="1.0.6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2a1f3d">
<title>Sp•t Quest</title>
<style>
:root{--bg:#2a1f3d;--ink:#2a1f3d;--cream:#fff6e6;--pink:#ff3d8b;--gold:#ffc93c;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--cream);font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito",system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
svg use{overflow:visible}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
#defsvg{position:absolute;width:0;height:0;overflow:hidden}

/* logo + buttons */
.logo{font-weight:900;letter-spacing:-1px;line-height:1;white-space:nowrap;color:var(--cream);text-shadow:0 4px 0 var(--pink),0 8px 0 rgba(0,0,0,.35)}
.lens{display:inline-block;width:.8em;height:.8em;vertical-align:-.06em;margin:0 .02em}
.lens svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 4px 0 var(--pink)) drop-shadow(0 4px 0 rgba(0,0,0,.35))}
.btn{background:var(--pink);color:#fff;font-weight:900;border-radius:999px;padding:12px 26px;font-size:18px;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink)}
.btn:active,.btn2:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.btn2{background:var(--cream);color:var(--ink);font-weight:900;border-radius:999px;padding:12px 22px;font-size:18px;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink)}
.ibtn{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.12);font-weight:900;font-size:20px;display:grid;place-items:center;flex:none}

/* title */
#title{align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#4a3570,#1d1430 75%);overflow:hidden}
#tbg{position:absolute;inset:0;pointer-events:none}
#tbg svg{position:absolute;width:64px;height:64px;opacity:.9;animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-14px) rotate(calc(var(--r) * -1))}}
.tmid{position:relative;display:flex;flex-direction:column;align-items:center;gap:30px;padding:30px;background:radial-gradient(closest-side,rgba(29,20,48,.92),rgba(29,20,48,0));border-radius:50%}
#title .logo{font-size:min(15vw,78px)}
#play{font-size:24px;padding:14px 46px}

/* levels */
#levels{background:radial-gradient(circle at 50% 0,#3d2c5a,#1d1430 70%)}
.lhead{display:flex;align-items:center;gap:10px;padding:calc(var(--sat) + 12px) 14px 6px}
.lhead .logo{font-size:30px;flex:1;text-shadow:0 3px 0 var(--pink),0 6px 0 rgba(0,0,0,.35)}
.scount{display:flex;align-items:center;gap:4px;font-weight:900;font-size:16px;background:rgba(0,0,0,.3);padding:6px 10px;border-radius:12px}
.scount svg{width:22px;height:22px}
#grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:30px 12px;padding:30px 14px calc(var(--sab) + 40px);align-content:start;max-width:900px;width:100%;margin:0 auto;touch-action:pan-y}
.card{position:relative;border-radius:20px;background:var(--c);padding:22px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink),inset 0 -50px 40px -36px rgba(0,0,0,.3);color:#fff}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.card .ic{width:58px;height:58px;overflow:visible;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.card .num{position:absolute;top:6px;left:7px;font-weight:900;font-size:12px;background:rgba(0,0,0,.28);border-radius:8px;padding:1px 6px}
.card .nm{font-weight:900;font-size:13px;text-shadow:0 2px 0 rgba(0,0,0,.35);text-align:center;line-height:1.1;min-height:2.2em;display:flex;align-items:center}
.card .meta{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:900;background:rgba(0,0,0,.3);border-radius:10px;padding:2px 6px;min-height:22px}
.card .meta .hrt svg{width:13px;height:13px}
.card.locked{background:#3a3150;box-shadow:0 5px 0 var(--ink)}
.card.locked .ic,.card.locked .nm{opacity:.3;filter:grayscale(1)}
.card .lock{position:absolute;left:50%;top:26px;width:46px;height:46px;margin-left:-23px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.4))}
.card .lock svg{width:100%;height:100%}
.gstar{position:absolute;top:-30px;left:50%;width:48px;height:48px;margin-left:-24px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35));animation:tw 2.6s ease-in-out infinite}
.gstar svg{width:100%;height:100%}
@keyframes tw{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.08)}}
.card.new{animation:newp .9s 4}
@keyframes newp{50%{transform:scale(1.08);box-shadow:0 5px 0 var(--ink),0 0 0 6px var(--gold)}}
.card.nope{animation:nope .35s}
@keyframes nope{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* game */
#game{background:#120c1c}
.bar{display:flex;align-items:center;gap:8px;padding:calc(var(--sat) + 6px) 8px 6px;background:var(--bg)}
.ttl{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-weight:900;font-size:17px}
.ttl .n{background:var(--c,#ff3d8b);color:#fff;border-radius:10px;padding:2px 8px;font-size:14px;border:2px solid var(--ink);flex:none}
.ttl .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cnt{font-weight:900;font-size:14px;opacity:.85;flex:none}
#hearts{display:flex;gap:1px;flex:none}
.hrt{display:inline-block;line-height:0}
.hrt svg{width:24px;height:24px;overflow:visible}
.hrt.full path{fill:#ff3d6e;stroke:var(--ink);stroke-width:8;stroke-linejoin:round}
.hrt.empty path{fill:rgba(255,255,255,.1);stroke:rgba(255,255,255,.4);stroke-width:6;stroke-linejoin:round}
.hrt.lose{animation:lose .6s}
@keyframes lose{0%{transform:scale(1.6)}30%{transform:scale(1.6) rotate(-15deg)}60%{transform:scale(1) rotate(10deg)}100%{transform:none}}
.prog{height:6px;background:rgba(255,255,255,.12);position:relative;margin:0 10px 6px;border-radius:3px}
#progFill{height:100%;background:linear-gradient(90deg,var(--pink),var(--gold));border-radius:3px;width:0;transition:width .4s}
.prog i{position:absolute;left:66.67%;top:-4px;width:4px;height:14px;margin-left:-2px;background:#fff;border-radius:2px;opacity:.5}
.prog.unl i{background:var(--gold);opacity:1}
#stage{flex:1;position:relative;overflow:hidden;touch-action:none;background:#120c1c;cursor:crosshair}
#scene,#fx{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
#stage.hurt::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 0 5px #ff3d6e,inset 0 0 80px rgba(255,40,80,.55);animation:hurt .5s forwards;pointer-events:none}
@keyframes hurt{from{opacity:1}to{opacity:0}}
.rg0{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round}
.rg1{fill:none;stroke:#ff2e88;stroke-linecap:round;stroke-linejoin:round}
.zb{display:flex;justify-content:center;gap:10px;padding:6px 8px 0;background:#120c1c}
.zb button{height:36px;min-width:48px;padding:0 14px;border-radius:12px;background:rgba(255,255,255,.1);font-size:22px;font-weight:900;border:2px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;gap:6px}
.zb #zfit{font-size:13px}
.zb svg{width:18px;height:18px}
.touch .zb #zin,.touch .zb #zout{display:none}
#ribbon{position:absolute;top:10px;left:50%;transform:translate(-50%,-140%);background:var(--gold);color:var(--ink);font-weight:900;padding:8px 16px;border-radius:30px;border:3px solid var(--ink);display:flex;gap:8px;align-items:center;pointer-events:none;white-space:nowrap;opacity:0;box-shadow:0 4px 0 var(--ink);cursor:pointer;z-index:5}
#ribbon b{background:var(--pink);color:#fff;border-radius:20px;padding:3px 10px;margin-left:4px;font-size:14px}
#ribbon svg{width:22px;height:22px}
#ribbon.show{animation:rib 5s ease forwards;pointer-events:auto}
@keyframes rib{0%{transform:translate(-50%,-140%);opacity:0}8%,90%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-140%);opacity:0}}
#coach{display:none;margin:6px 8px 0;background:var(--cream);color:var(--ink);border-radius:16px;padding:10px 12px;gap:10px;align-items:center;border:3px solid var(--ink)}
#game.tut #coach{display:flex}
.ctext{flex:1;font-weight:800;font-size:15px;line-height:1.25}
.crow{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:none}
.crow .btn{padding:8px 16px;font-size:15px;box-shadow:0 3px 0 var(--ink)}
.link{font-size:12px;font-weight:800;opacity:.6;text-decoration:underline}
.cicon{width:44px;height:44px;flex:none;position:relative;display:none;border-radius:12px;background:#ffe3ef}
.cicon.pinch,.cicon.drag{display:block}
.cicon::before,.cicon::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:var(--pink);top:15px;left:15px;border:2px solid var(--ink)}
.cicon.pinch::before{animation:pa 1.4s ease-in-out infinite}
.cicon.pinch::after{animation:pb 1.4s ease-in-out infinite}
.cicon.drag::after{display:none}
.cicon.drag::before{animation:dr 1.4s ease-in-out infinite}
@keyframes pa{0%,15%{transform:translate(-2px,2px)}65%,100%{transform:translate(-13px,13px)}}
@keyframes pb{0%,15%{transform:translate(2px,-2px)}65%,100%{transform:translate(13px,-13px)}}
@keyframes dr{0%,100%{transform:translateX(-12px)}50%{transform:translateX(12px)}}
#tray{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:7px 7px calc(var(--sab) + 14px);background:var(--bg);max-width:760px;width:100%;margin:0 auto}
#game.tut #tray{grid-template-columns:repeat(3,96px);justify-content:center}
#trayWrap{background:var(--bg)}
.ti{position:relative;background:var(--cream);border-radius:12px;padding:3px 2px 3px;display:flex;flex-direction:column;align-items:center;color:var(--ink);min-width:0;border:2px solid transparent}
.ti>svg{width:34px;height:34px;overflow:visible}
.ti span{font-size:10px;font-weight:800;line-height:1.15;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ti span.l{font-size:9px}
.ti.got{background:#c9c5d1}
.ti.got>svg{filter:grayscale(1);opacity:.4}
.ti.got span{color:#6e6878;text-decoration:line-through}
.ti .tick{position:absolute;top:3px;right:3px;width:22px;height:22px;display:none;z-index:2;line-height:0}
.ti .tick svg{width:100%;height:100%;display:block}
.ti.got .tick{display:block;animation:popin .4s}
.ti.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.18)}}
.ti.hl{animation:hl 1s ease-in-out infinite;border-color:var(--gold)}
@keyframes hl{50%{transform:translateY(-4px);box-shadow:0 0 0 4px var(--gold)}}

/* overlay */
.ovl{position:fixed;inset:0;background:rgba(20,12,32,.72);display:none;place-items:center;z-index:20}
.ovl.on{display:grid}
.ocard{background:var(--cream);color:var(--ink);border-radius:26px;padding:20px 24px 24px;text-align:center;width:min(86vw,340px);border:4px solid var(--ink);box-shadow:0 8px 0 rgba(0,0,0,.4);animation:popin .45s}
.ocard h2{margin:6px 0 2px;font-size:30px;font-weight:900}
.ocard p{margin:0 0 10px;font-weight:800;opacity:.75}
.bigstar svg{width:130px;height:130px;animation:spinin 1s cubic-bezier(.2,1.6,.4,1)}
.ocard .dh .hrt svg{width:30px;height:30px}
.ocard .dh .hrt.empty path{fill:rgba(0,0,0,.08);stroke:rgba(0,0,0,.3)}
.orow{display:flex;gap:10px;justify-content:center;margin-top:16px}
@keyframes popin{from{transform:scale(.5);opacity:0}}
@keyframes spinin{from{transform:scale(0) rotate(-200deg)}}
.madeby{font-weight:900;font-size:20px;color:var(--cream);opacity:.9;margin-top:-10px;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.snd svg{width:22px;height:22px}
.snd.off{opacity:.45}
.ibtn.sm{width:34px;height:34px;border-radius:11px}
.ibtn.sm svg{width:18px;height:18px}
@media (max-width:400px){.lhead .logo{font-size:24px}.lhead{gap:6px}.lhead .ibtn{width:38px;height:38px}.scount{padding:6px 8px;font-size:14px}}
#ver{position:fixed;right:6px;bottom:calc(var(--sab) + 1px);font-size:9px;opacity:.4;pointer-events:none;z-index:30;color:#fff;font-weight:700}
</style>
</head>
<body>
<svg id="defsvg" aria-hidden="true"><defs id="defs"></defs></svg>

<section id="title" class="screen on">
  <div id="tbg"></div>
  <div class="tmid">
    <div class="logo">Sp<span class="lens" id="lens1"></span>t Quest</div>
    <button class="btn" id="play">Play</button>
    <div class="madeby">made by Scar⭐️</div>
  </div>
</section>

<section id="levels" class="screen">
  <div class="lhead">
    <div class="logo">Sp<span class="lens"></span>t Quest</div>
    <div class="scount" id="scount"></div>
    <button class="ibtn snd" data-k="music" aria-label="Music"></button>
    <button class="ibtn snd" data-k="sfx" aria-label="Sound effects"></button>
    <button class="ibtn" id="howto" aria-label="How to play">?</button>
  </div>
  <div id="grid"></div>
</section>

<section id="game" class="screen">
  <div class="bar">
    <button class="ibtn" id="back" aria-label="Back">‹</button>
    <div class="ttl"><span class="n" id="lvNum"></span><span class="nm" id="lvName"></span></div>
    <span id="cnt"></span>
    <button class="ibtn snd sm" data-k="music" aria-label="Music"></button>
    <div id="hearts"></div>
  </div>
  <div class="prog" id="prog"><div id="progFill"></div><i></i></div>
  <div id="stage">
    <svg id="scene" xmlns="http://www.w3.org/2000/svg"></svg>
    <canvas id="fx"></canvas>
    <div id="ribbon"></div>
  </div>
  <div class="zb">
      <button id="zin" aria-label="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out">−</button>
      <button id="zfit" aria-label="Show whole picture"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Whole picture</button>
  </div>
  <div id="coach"><div class="cicon" id="cicon"></div><div class="ctext" id="ctext"></div><div class="crow"><button class="btn" id="cbtn">Next</button><button class="link" id="cskip">Skip</button></div></div>
  <div id="trayWrap"><div id="tray"></div></div>
</section>

<div class="ovl" id="done"><div class="ocard">
  <div class="bigstar" id="bigstar"></div>
  <h2 id="doneT">Gold star!</h2>
  <p id="doneSub">All 15 found</p>
  <div class="dh" id="doneHearts"></div>
  <div class="orow"><button class="btn2" id="dLevels">Levels</button><button class="btn" id="dNext">Next ›</button></div>
</div></div>

<div id="ver">v1.0.6</div>
<script>
/* ===== core: palette, cel gradients, shape helpers ===== */
const OUT = '#2a1f3d';
const SW = 1600, SH = 2200;
const PAL = {
  red:'#ef4848', maroon:'#a3263a', pink:'#ff9cc2', hot:'#ff3d8b', orange:'#ff9a2e', peach:'#ffb88f',
  yellow:'#ffd43b', gold:'#f2b51d', cream:'#fff1d2', white:'#fbfbfd', lime:'#a8dc4a', green:'#4cba5a',
  dgreen:'#2f8a45', teal:'#2ab3a6', mint:'#9df0cc', cyan:'#5ad8ec', sky:'#8fd3ff', ice:'#cdeeff',
  blue:'#3f86e8', navy:'#2f4a9e', purple:'#9061e0', lilac:'#cbaaff', brown:'#9a5b32', dbrown:'#6b3f24',
  tan:'#e2ae72', wood:'#c98545', sand:'#f4d88e', choc:'#7a4529', grey:'#a7b0ba', dgrey:'#5f6873',
  black:'#3d3948', silver:'#dbe3ea', skin:'#f7cba4', stone:'#b9b4ab'
};
function hex2(n){return Math.round(Math.max(0,Math.min(255,n))).toString(16).padStart(2,'0')}
function mix(a,b,t){const p=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16));const A=p(a),B=p(b);return '#'+A.map((v,i)=>hex2(v+(B[i]-v)*t)).join('')}
function gradDefs(){
  let s='';
  for(const [n,c] of Object.entries(PAL)){
    s+=`<linearGradient id="k-${n}" x1="0" y1="0" x2="1" y2="1"><stop offset=".16" stop-color="${mix(c,'#ffffff',.28)}"/><stop offset=".16" stop-color="${c}"/><stop offset=".6" stop-color="${c}"/><stop offset=".6" stop-color="${mix(c,'#3b1d5c',.3)}"/></linearGradient>`;
  }
  return s;
}
// fill resolvers: palette name -> cel gradient, '@name' -> flat palette, '#hex'/url -> as is
const k = c => (c[0]==='#'||c.startsWith('url')||c==='none') ? c : c[0]==='@' ? PAL[c.slice(1)] : (PAL[c] ? `url(#k-${c})` : c);
const f = c => c[0]==='#' ? c : c[0]==='@' ? PAL[c.slice(1)] : (PAL[c]||c);
const n1 = v => +(+v).toFixed(1);

/* filled shapes (outline inherited from parent group) */
const C = (x,y,r,c) => `<circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(r)}" fill="${k(c)}"/>`;
const E = (x,y,rx,ry,c,a) => `<ellipse cx="${n1(x)}" cy="${n1(y)}" rx="${n1(rx)}" ry="${n1(ry)}" fill="${k(c)}"${a?` transform="rotate(${a} ${n1(x)} ${n1(y)})"`:''}/>`;
const R = (x,y,w,h,c,rx=0,a) => `<rect x="${n1(x)}" y="${n1(y)}" width="${n1(w)}" height="${n1(h)}" rx="${rx}" fill="${k(c)}"${a?` transform="rotate(${a} ${n1(x+w/2)} ${n1(y+h/2)})"`:''}/>`;
const P = (d,c,ev) => `<path d="${d}" fill="${k(c)}"${ev?' fill-rule="evenodd"':''}/>`;
/* strokes */
const L = (d,w=4,c=OUT) => `<path d="${d}" fill="none" stroke="${f(c)}" stroke-width="${w}"/>`;
const S = (d,c,w=6,o=5) => `<path d="${d}" fill="none" stroke="${OUT}" stroke-width="${w+o}"/><path d="${d}" fill="none" stroke="${f(c)}" stroke-width="${w}"/>`;
const H = (d,w=4,o=.8) => `<path d="${d}" fill="none" stroke="#fff" stroke-width="${w}" opacity="${o}"/>`;
const D = (x,y,r,c=OUT) => `<circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(r)}" fill="${f(c)}" stroke="none"/>`;
const G = (a,s,x=50,y=50) => `<g transform="rotate(${a} ${x} ${y})">${s}</g>`;
const T = (t,x,y,sz,c=OUT,w=900,extra='') => `<text x="${x}" y="${y}" font-size="${sz}" fill="${f(c)}" stroke="none" text-anchor="middle" font-weight="${w}" font-family="ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif" ${extra}>${t}</text>`;
const circ = (x,y,r) => `M${n1(x-r)} ${n1(y)}a${n1(r)} ${n1(r)} 0 1 0 ${n1(2*r)} 0a${n1(r)} ${n1(r)} 0 1 0 ${n1(-2*r)} 0Z`;
const RING = (x,y,R1,r,c) => P(circ(x,y,R1)+circ(x,y,r),c,1);
/* raw shapes for unions */
const c_ = (x,y,r) => `<circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(r)}"/>`;
const e_ = (x,y,rx,ry,a) => `<ellipse cx="${n1(x)}" cy="${n1(y)}" rx="${n1(rx)}" ry="${n1(ry)}"${a?` transform="rotate(${a} ${n1(x)} ${n1(y)})"`:''}/>`;
const r_ = (x,y,w,h,rx=0) => `<rect x="${n1(x)}" y="${n1(y)}" width="${n1(w)}" height="${n1(h)}" rx="${rx}"/>`;
const p_ = d => `<path d="${d}"/>`;
const U = (c,sh,w=5) => `<g fill="${OUT}" stroke="${OUT}" stroke-width="${w}">${sh}</g><g fill="${k(c)}" stroke="none">${sh}</g>`;

function starPath(cx,cy,R1,r,n=5,rot=-90){let d='';for(let i=0;i<n*2;i++){const a=(rot+i*180/n)*Math.PI/180,rr=i%2?r:R1;d+=(i?'L':'M')+n1(cx+rr*Math.cos(a))+' '+n1(cy+rr*Math.sin(a))}return d+'Z'}
function gearPath(cx,cy,R1,r,n){let d='';const m=n*4;for(let j=0;j<m;j++){const a=j/m*Math.PI*2,rr=(j%4===1||j%4===2)?R1:r;d+=(j?'L':'M')+n1(cx+rr*Math.cos(a))+' '+n1(cy+rr*Math.sin(a))}return d+'Z'}
function around(n,R1,fn,cx=50,cy=50,a0=0){let s='';for(let i=0;i<n;i++){const a=a0+i/n*Math.PI*2;s+=fn(cx+R1*Math.cos(a),cy+R1*Math.sin(a),a*180/Math.PI,i)}return s}

/* seeded RNG */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rr = (rng,a,b) => a+(b-a)*rng();
const pick = (rng,arr) => arr[Math.floor(rng()*arr.length)];
function shuffle(rng,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* symbol defs for every item */
function itemDefs(){
  let s='';
  for(const id in I) s+=`<symbol id="i-${id}" viewBox="0 0 100 100" overflow="visible"><g stroke="${OUT}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">${I[id].s}</g></symbol>`;
  return s;
}

/* ===== scenery helpers (world coords, 1600 x 2200) ===== */
const tr = (x,y,a,s,inner) => `<g transform="translate(${n1(x)} ${n1(y)})${a?` rotate(${n1(a)})`:''}${s&&s!==1?` scale(${s})`:''}">${inner}</g>`;
const full = c => `<rect x="-20" y="-20" width="${SW+40}" height="${SH+40}" fill="${k(c)}" stroke="none"/>`;
const pat = (id,w,h,inner,extra='') => `<pattern id="${id}" patternUnits="userSpaceOnUse" width="${w}" height="${h}" ${extra}>${inner}</pattern>`;
const vgrad = (id,stops,y1=0,y2=SH) => `<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="0" y1="${y1}" x2="0" y2="${y2}">${stops.map(([o,c,op])=>`<stop offset="${o}" stop-color="${c}"${op!=null?` stop-opacity="${op}"`:''}/>`).join('')}</linearGradient>`;
const NS = (d,fill,op=1) => `<path d="${d}" fill="${fill}" stroke="none" opacity="${op}"/>`;
const shade = (x,y,r,o=.16) => `<path d="M${n1(x+r*.71)} ${n1(y-r*.71)}A${n1(r)} ${n1(r)} 0 0 1 ${n1(x-r*.71)} ${n1(y+r*.71)}A${n1(r*1.25)} ${n1(r*1.25)} 0 0 0 ${n1(x+r*.71)} ${n1(y-r*.71)}Z" fill="${OUT}" opacity="${o}" stroke="none"/>`;
function blob(x,y,r,rng,n=9,j=.22,ry){
  ry=ry||r; const p=[];
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2,q=1+(rng()*2-1)*j;p.push([x+Math.cos(a)*r*q,y+Math.sin(a)*ry*q])}
  const m=(a,b)=>`${n1((a[0]+b[0])/2)} ${n1((a[1]+b[1])/2)}`;
  let d=`M${m(p[n-1],p[0])}`;
  for(let i=0;i<n;i++)d+=`Q${n1(p[i][0])} ${n1(p[i][1])} ${m(p[i],p[(i+1)%n])}`;
  return d+'Z';
}
const rbox = (rng,b) => [rr(rng,b[0],b[0]+b[2]), rr(rng,b[1],b[1]+b[3])];
const ALL = [0,0,SW,SH];
function tufts(rng,n,col,box=ALL,sz=16,w=4){let d='';for(let i=0;i<n;i++){const [x,y]=rbox(rng,box);d+=`M${n1(x-sz*.45)} ${n1(y-sz)}L${n1(x)} ${n1(y)}L${n1(x+sz*.45)} ${n1(y-sz)}`}return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`}
function dots(rng,n,col,r1,r2,box=ALL,op=1){let d='';for(let i=0;i<n;i++){const [x,y]=rbox(rng,box);d+=circ(x,y,rr(rng,r1,r2))}return NS(d,col,op)}
function dashes(rng,n,cols,len,box=ALL,w=6){const ds=cols.map(()=>'');for(let i=0;i<n;i++){const [x,y]=rbox(rng,box),a=rng()*Math.PI;ds[i%cols.length]+=`M${n1(x)} ${n1(y)}l${n1(Math.cos(a)*len)} ${n1(Math.sin(a)*len)}`}return ds.map((d,i)=>`<path d="${d}" stroke="${cols[i]}" stroke-width="${w}" stroke-linecap="round" fill="none"/>`).join('')}
function flowers(rng,n,petal,center,box=ALL,r=7){let p='',c='';for(let i=0;i<n;i++){const [x,y]=rbox(rng,box);for(let j=0;j<5;j++){const a=j/5*Math.PI*2;p+=circ(x+Math.cos(a)*r,y+Math.sin(a)*r,r*.75)}c+=circ(x,y,r*.55)}return NS(p,petal)+NS(c,center)}
function sparkles(rng,n,col,box=ALL,s1=8,s2=16,op=.9){let d='';for(let i=0;i<n;i++){const [x,y]=rbox(rng,box),s=rr(rng,s1,s2);d+=`M${n1(x)} ${n1(y-s)}Q${n1(x)} ${n1(y)} ${n1(x+s)} ${n1(y)}Q${n1(x)} ${n1(y)} ${n1(x)} ${n1(y+s)}Q${n1(x)} ${n1(y)} ${n1(x-s)} ${n1(y)}Q${n1(x)} ${n1(y)} ${n1(x)} ${n1(y-s)}Z`}return NS(d,col,op)}

/* ===== sound: synthesised sfx + EDM loop (Web Audio, no files) ===== */
const SND = (() => {
  let ac = null, master, musicBus, sfxBus, noiseBuf, timer = 0, nextT = 0, step = 0, playing = false;
  const st = { music: true, sfx: true };
  try { const s = JSON.parse(localStorage.getItem('spotquest.snd')); if (s) Object.assign(st, s); } catch (e) {}
  const saveSt = () => { try { localStorage.setItem('spotquest.snd', JSON.stringify(st)); } catch (e) {} };
  const BPM = 124, S16 = 60 / BPM / 4;
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    ac = new AC();
    master = ac.createGain(); master.gain.value = .8;
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    master.connect(comp); comp.connect(ac.destination);
    musicBus = ac.createGain(); musicBus.gain.value = st.music ? .42 : 0; musicBus.connect(master);
    sfxBus = ac.createGain(); sfxBus.gain.value = st.sfx ? .9 : 0; sfxBus.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // unlock on iOS
    const b = ac.createBufferSource(); b.buffer = ac.createBuffer(1, 1, 22050); b.connect(ac.destination); b.start(0);
    if (st.music) startMusic();
  }

  /* --- building blocks --- */
  function env(g, t, a, peak, dec, sus = 0.0001) {
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(Math.max(sus, 0.0001), t + a + dec);
  }
  function tone(bus, type, f, t, dur, vol, f2, filt) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    let out = o;
    if (filt) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = filt; o.connect(fl); out = fl; }
    out.connect(g); g.connect(bus); env(g, t, .004, vol, dur); o.start(t); o.stop(t + dur + .05);
  }
  function noise(bus, t, dur, vol, type, freq, q = 1) {
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q;
    s.connect(f); f.connect(g); g.connect(bus); env(g, t, .002, vol, dur); s.start(t, Math.random() * .5); s.stop(t + dur + .05);
  }

  /* --- sound effects --- */
  const fx = {
    find() { const t = ac.currentTime; [76, 79, 84, 88].forEach((m, i) => { tone(sfxBus, 'triangle', hz(m), t + i * .055, .28, .32); tone(sfxBus, 'sine', hz(m + 12), t + i * .055, .18, .12); });
      for (let i = 0; i < 6; i++) tone(sfxBus, 'sine', hz(96 + Math.floor(Math.random() * 8)), t + .2 + i * .04, .09, .06); },
    miss() { const t = ac.currentTime; tone(sfxBus, 'sawtooth', 220, t, .28, .25, 70, 900); tone(sfxBus, 'square', 110, t + .02, .22, .12, 55, 600); },
    tap() { tone(sfxBus, 'sine', 880, ac.currentTime, .06, .12, 1320); },
    unlock() { const t = ac.currentTime; [72, 76, 79, 84, 79, 84].forEach((m, i) => tone(sfxBus, 'square', hz(m), t + i * .09, .2, .14, 0, 2600)); },
    star() { const t = ac.currentTime; [60, 64, 67, 72, 76, 79, 84].forEach((m, i) => { tone(sfxBus, 'sawtooth', hz(m), t + i * .07, .5, .1, 0, 3000); tone(sfxBus, 'triangle', hz(m + 12), t + i * .07, .4, .12); });
      noise(sfxBus, t + .5, 1.2, .08, 'highpass', 7000); }
  };
  function play(name) { if (!ac || !st.sfx) return; if (ac.state === 'suspended') ac.resume(); try { fx[name](); } catch (e) {} }

  /* --- EDM loop: Am F C G at 124bpm --- */
  const CH = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];
  const BASS = [45, 41, 36, 43];
  const ARP = [0, 1, 2, 1, 2, 0, 2, 1];
  function schedule() {
    while (nextT < ac.currentTime + .12) { playStep(step, nextT); nextT += S16; step++; }
    timer = setTimeout(schedule, 25);
  }
  function playStep(s, t) {
    const bar = Math.floor(s / 16), pos = s % 16, sec = Math.floor(bar / 8) % 4, ch = CH[bar % 4];
    const drop = sec !== 0;                      // first 8 bars = intro, then the drop
    if (pos % 4 === 0) {                         // kick
      const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + .14);
      o.connect(g); g.connect(musicBus); env(g, t, .002, drop ? .95 : .6, .3); o.start(t); o.stop(t + .35);
    }
    if (pos % 4 === 2) noise(musicBus, t, .05, .16, 'highpass', 8000);          // open hat on the offbeat
    else if (drop) noise(musicBus, t, .025, .05, 'highpass', 10000);            // closed hats
    if (drop && (pos === 4 || pos === 12)) noise(musicBus, t, .16, .32, 'bandpass', 1500, .8);  // clap
    if (pos % 4 === 2) tone(musicBus, 'sawtooth', hz(BASS[bar % 4]), t, S16 * 1.6, drop ? .3 : .18, 0, 700); // offbeat bass
    if (drop && (pos === 0 || pos === 6 || pos === 10)) ch.forEach(m => [-8, 8].forEach(dt => {      // chord stabs
      const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain(); o.type = 'sawtooth'; o.frequency.value = hz(m + 12); o.detune.value = dt;
      f.type = 'lowpass'; f.frequency.setValueAtTime(3200, t); f.frequency.exponentialRampToValueAtTime(500, t + .25);
      o.connect(f); f.connect(g); g.connect(musicBus); env(g, t, .005, .05, .25); o.start(t); o.stop(t + .3);
    }));
    if (sec === 2 || sec === 3 || (!drop && pos % 2 === 0)) {                    // arp lead
      const m = ch[ARP[pos % 8]] + (pos >= 8 ? 24 : 12);
      tone(musicBus, sec === 3 ? 'square' : 'triangle', hz(m), t, S16 * .9, drop ? .1 : .08, 0, 4000);
    }
    if (pos === 0 && bar % 8 === 7) noise(musicBus, t, S16 * 16, .06, 'bandpass', 3000, 2);   // riser into next section
  }
  function startMusic() { if (!ac || playing) return; playing = true; step = 0; nextT = ac.currentTime + .1; schedule(); }
  function stopMusic() { playing = false; clearTimeout(timer); }

  function setMusic(on) { st.music = on; saveSt(); if (!ac) return; musicBus.gain.setTargetAtTime(on ? .42 : 0, ac.currentTime, .05); if (on) startMusic(); else setTimeout(() => { if (!st.music) stopMusic(); }, 300); }
  function setSfx(on) { st.sfx = on; saveSt(); if (ac) sfxBus.gain.setTargetAtTime(on ? .9 : 0, ac.currentTime, .02); }
  document.addEventListener('visibilitychange', () => { if (!ac) return; if (document.hidden) { stopMusic(); ac.suspend(); } else { ac.resume(); if (st.music) startMusic(); } });
  return { init, play, setMusic, setSfx, st };
})();

function layout(L, i, rng, tut){
  const t = tut ? 0 : i/24;
  const ts = tut ? 104 : 66 - 22*t, nDec = tut ? 9 : Math.round(40 + 48*t), rot = tut ? 8 : 16 + 26*t;
  const placed = [], M = 50, avoid = L.avoid || [];
  const ok = (x,y,r) => x>M+r && x<SW-M-r && y>M+r && y<SH-M-r
    && !avoid.some(a => x>a[0]-r && x<a[0]+a[2]+r && y>a[1]-r && y<a[1]+a[3]+r)
    && placed.every(p => Math.hypot(p.x-x,p.y-y) > p.r+r+10);
  const put = (id,s,box,tries) => { const r = s*.44; for(let q=0;q<tries;q++){ const x = box[0]+rng()*box[2], y = box[1]+rng()*box[3]; if(ok(x,y,r)){ const o={id,x,y,s,r,a:(rng()*2-1)*rot,found:false}; placed.push(o); return o; } } return null; };
  const cells = shuffle(rng, [...Array(15).keys()]), targets = [];
  L.items.forEach((id,j) => {
    const s = ts*rr(rng,.9,1.12);
    let o = tut ? put(id,s,[340,560,920,1080],300) : (put(id,s,[(cells[j]%3)*SW/3, Math.floor(cells[j]/3)*SH/5, SW/3, SH/5],150) || put(id,s,ALL,800));
    if(!o){ o = {id,x:rr(rng,120,SW-120),y:rr(rng,240,SH-120),s,r:s*.44,a:0,found:false}; placed.push(o); }
    targets.push(o);
  });
  const groups = new Set(L.items.map(id => I[id].g));
  const pool = tut ? TUT_DECOYS : Object.keys(I).filter(id => !groups.has(I[id].g));
  for(let d=0; d<nDec; d++) put(pick(rng,pool), ts*rr(rng,.8,1.25), tut?[200,300,1200,1700]:ALL, 50);
  const all = shuffle(rng, placed);
  const svg = all.map(o => `<use href="#i-${o.id}" x="${n1(-o.s/2)}" y="${n1(-o.s/2)}" width="${n1(o.s)}" height="${n1(o.s)}" transform="translate(${n1(o.x)} ${n1(o.y)}) rotate(${n1(o.a)})"/>`).join('');
  return {targets, svg};
}

/* --- run state --- */
let run = null, rings = null;
const stage = $('#stage'), scene = $('#scene'), fx = $('#fx'), ctx = fx.getContext('2d');
function startLevel(i){
  const tut = i < 0, L = tut ? TUT : LEVELS[i];
  const lay = layout(L, i, mulberry(tut ? 4242 : ((Date.now() ^ ((i+1)*7919)) >>> 0)), tut);
  scene.innerHTML = `<g stroke="${OUT}" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">${L.bg(mulberry(1000 + i))}</g><g>${lay.svg}</g><g id="rings"></g><path d="M-9000 -9000H${SW+9000}V${SH+9000}H-9000ZM0 0V${SH}H${SW}V0Z" fill="#120c1c" fill-rule="evenodd"/>`;
  rings = scene.querySelector('#rings');
  run = {i, tut, L, targets: lay.targets, found:0, hearts:3, acted:false, over:false, tmiss:false};
  $('#lvNum').textContent = tut ? '?' : i+1;
  $('#lvNum').style.setProperty('--c', L.col);
  $('#lvName').textContent = L.name;
  $('#tray').innerHTML = L.items.map(id => `<div class="ti" data-id="${id}"><svg viewBox="0 0 100 100"><use href="#i-${id}" width="100" height="100"/></svg><span${I[id].n.length>10?' class="l"':''}>${I[id].n}</span><i class="tick">${TICK}</i></div>`).join('');
  $('#game').classList.toggle('tut', tut);
  $('#done').classList.remove('on');
  $('#ribbon').classList.remove('show');
  parts.length = 0; panTotal = 0;
  updateHearts(); updateProg();
  show('game');
  resize(true);
  if(tut) tutStart();
}
function updateHearts(lost){
  $('#hearts').innerHTML = hearts(run.hearts);
  if(lost){ const el = $('#hearts').children[run.hearts]; if(el) el.classList.add('lose'); }
}
function updateProg(){
  $('#progFill').style.width = (run.found / run.targets.length * 100) + '%';
  $('#prog').classList.toggle('unl', !run.tut && run.found >= 10);
  $('#prog').style.visibility = run.tut ? 'hidden' : '';
  $('#cnt').textContent = `${run.found}/${run.targets.length}`;
}
function record(){
  if(run.tut) return;
  const b = best(run.i), f = run.found, h = run.hearts;
  if(!b || f > b.f || (f === b.f && h > b.h)){ prog.lv[run.i] = {f, h}; save(); }
}
$('#back').onclick = () => { if(run && run.tut){ prog.tut = 1; save(); } goLevels(); };
$('#dLevels').onclick = goLevels;
$('#dNext').onclick = () => { const n = run.i + 1; if(n < LEVELS.length) startLevel(n); else goLevels(); };

/* --- view: pan & zoom --- */
let vw = 0, vh = 0, dpr = 1, fitS = 1, maxS = 2.4, srect = {left:0, top:0};
const view = {s:1, tx:0, ty:0};
const clampS = s => Math.max(fitS, Math.min(maxS, s));
function clampView(){
  const sw = SW*view.s, sh = SH*view.s;
  view.tx = sw <= vw ? (vw-sw)/2 : Math.min(0, Math.max(vw-sw, view.tx));
  view.ty = sh <= vh ? (vh-sh)/2 : Math.min(0, Math.max(vh-sh, view.ty));
}
function resize(reset){
  const r = stage.getBoundingClientRect(); if(!r.width || !r.height) return;
  const ow = vw, oh = vh, cx = (ow/2 - view.tx)/view.s, cy = (oh/2 - view.ty)/view.s;
  vw = r.width; vh = r.height; srect = r;
  dpr = Math.min(2, window.devicePixelRatio || 1);
  fx.width = Math.round(vw*dpr); fx.height = Math.round(vh*dpr);
  fitS = Math.min(vw/SW, vh/SH); maxS = Math.max(2.4, fitS*5);
  if(reset || !ow){ view.s = fitS; view.tx = 0; view.ty = 0; }
  else { view.s = clampS(view.s); view.tx = vw/2 - cx*view.s; view.ty = vh/2 - cy*view.s; }
  clampView(); render();
}
new ResizeObserver(() => { if(run) resize(false); }).observe(stage);
let rq = 0;
function render(){
  if(rq) return;
  rq = requestAnimationFrame(() => {
    rq = 0;
    scene.setAttribute('viewBox', `${(-view.tx/view.s).toFixed(2)} ${(-view.ty/view.s).toFixed(2)} ${(vw/view.s).toFixed(2)} ${(vh/view.s).toFixed(2)}`);
    if(parts.length) loopFx();
    if(run && run.tut) tutCheck();
  });
}
function zoomAt(px, py, ns){
  ns = clampS(ns); const wx = (px-view.tx)/view.s, wy = (py-view.ty)/view.s;
  view.s = ns; view.tx = px - wx*ns; view.ty = py - wy*ns; clampView(); render();
}
let zanim = 0;
function animZoom(px, py, target){
  cancelAnimationFrame(zanim); const s0 = view.s, s1 = clampS(target), t0 = performance.now();
  const step = now => { const t = Math.min(1,(now-t0)/220), e = 1-(1-t)*(1-t); zoomAt(px, py, s0*Math.pow(s1/s0, e)); if(t < 1) zanim = requestAnimationFrame(step); };
  zanim = requestAnimationFrame(step);
}
$('#zin').onclick = () => animZoom(vw/2, vh/2, view.s*1.6);
$('#zout').onclick = () => animZoom(vw/2, vh/2, view.s/1.6);
$('#zfit').onclick = () => animZoom(vw/2, vh/2, fitS);
document.querySelectorAll('.zb button').forEach(b => b.addEventListener('pointerdown', e => e.stopPropagation()));

/* --- gestures --- */
const ptrs = new Map(); let gest = null, pinch = null, panTotal = 0, vel = {x:0,y:0}, lastMove = 0, inertia = 0;
const pt = e => ({x: e.clientX - srect.left, y: e.clientY - srect.top});
function startPinch(){ const [a,b] = [...ptrs.values()]; pinch = {d: Math.hypot(a.x-b.x, a.y-b.y) || 1, mx:(a.x+b.x)/2, my:(a.y+b.y)/2, s:view.s, tx:view.tx, ty:view.ty}; }
stage.addEventListener('pointerdown', e => {
  if(!run) return;
  try{ stage.setPointerCapture(e.pointerId); }catch(_){}
  const p = pt(e); ptrs.set(e.pointerId, p);
  cancelAnimationFrame(inertia); cancelAnimationFrame(zanim);
  if(ptrs.size === 1){ gest = {x0:p.x, y0:p.y, t0:performance.now(), lx:p.x, ly:p.y, multi:false, panning:false}; vel = {x:0,y:0}; }
  else { if(gest) gest.multi = true; startPinch(); }
});
stage.addEventListener('pointermove', e => {
  if(!ptrs.has(e.pointerId)) return;
  const p = pt(e); ptrs.set(e.pointerId, p);
  if(ptrs.size >= 2 && pinch){
    const [a,b] = [...ptrs.values()], d = Math.hypot(a.x-b.x, a.y-b.y), mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    const ns = clampS(pinch.s * d / pinch.d), wx = (pinch.mx-pinch.tx)/pinch.s, wy = (pinch.my-pinch.ty)/pinch.s;
    view.s = ns; view.tx = mx - wx*ns; view.ty = my - wy*ns; clampView(); render();
  } else if(ptrs.size === 1 && gest){
    if(!gest.panning && Math.hypot(p.x-gest.x0, p.y-gest.y0) > 9){ gest.panning = true; gest.lx = gest.x0; gest.ly = gest.y0; }
    if(gest.panning){
      const dx = p.x-gest.lx, dy = p.y-gest.ly, now = performance.now(), dt = Math.max(8, now-lastMove);
      gest.lx = p.x; gest.ly = p.y; view.tx += dx; view.ty += dy; panTotal += Math.hypot(dx,dy);
      vel = {x: dx/dt*16, y: dy/dt*16}; lastMove = now; clampView(); render();
    }
  }
});
function ptrUp(e){
  if(!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if(ptrs.size === 1 && gest){ const p = [...ptrs.values()][0]; gest.lx = p.x; gest.ly = p.y; gest.panning = true; pinch = null; }
  else if(ptrs.size === 0 && gest){
    if(e.type === 'pointerup' && !gest.multi && !gest.panning && performance.now()-gest.t0 < 700) tap(gest.x0, gest.y0);
    else if(gest.panning && !gest.multi && performance.now()-lastMove < 90) startInertia();
    gest = null; pinch = null;
  }
}
stage.addEventListener('pointerup', ptrUp);
stage.addEventListener('pointercancel', ptrUp);
function startInertia(){
  let vx = vel.x, vy = vel.y;
  const step = () => { vx *= .92; vy *= .92; if(Math.hypot(vx,vy) < .4){ inertia = 0; return; } view.tx += vx; view.ty += vy; clampView(); render(); inertia = requestAnimationFrame(step); };
  inertia = requestAnimationFrame(step);
}
stage.addEventListener('wheel', e => { e.preventDefault(); if(!run) return; const p = pt(e); zoomAt(p.x, p.y, view.s*Math.exp(-e.deltaY*(e.ctrlKey ? .012 : .0018))); }, {passive:false});
['gesturestart','gesturechange','gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
document.addEventListener('dblclick', e => e.preventDefault());

/* --- tapping --- */
function tap(sx, sy){
  if(!run || run.over) return;
  const wx = (sx-view.tx)/view.s, wy = (sy-view.ty)/view.s;
  if(wx < 0 || wy < 0 || wx > SW || wy > SH) return;
  let hit = null, bd = 1e9;
  for(const t of run.targets){ const d = Math.hypot(t.x-wx, t.y-wy), tol = t.r*1.1 + Math.min(12/view.s, t.r*.45); if(d < tol && d < bd){ bd = d; hit = t; } }
  if(hit){ if(!hit.found) find(hit); return; }
  miss(wx, wy);
}
function find(t){
  t.found = true; run.found++;
  drawRing(t); burst(t.x, t.y, t.s); SND.play('find');
  const el = document.querySelector(`.ti[data-id="${t.id}"]`); if(el){ el.classList.add('got','pop'); el.classList.remove('hl'); }
  updateProg();
  if(run.tut){ tutCheck(); return; }
  const wasUnl = run.i < LEVELS.length-1 && unlocked(run.i+1);
  record();
  if(run.found === 10 && run.i < LEVELS.length-1 && !wasUnl){ justUnlocked = run.i+1; ribbon(`Level ${run.i+2} unlocked!`, run.i+1); }
  if(run.found === run.targets.length){ run.over = true; setTimeout(showDone, 1100); }
}
function miss(wx, wy){
  missFx(wx, wy); SND.play('miss');
  if(run.hearts > 0){ run.hearts--; updateHearts(true); }
  stage.classList.remove('hurt'); void stage.offsetWidth; stage.classList.add('hurt');
  if(run.tut){ run.tmiss = true; tutCheck(); } else record();
}
const rib = $('#ribbon');
['pointerdown','pointerup','pointermove'].forEach(t => rib.addEventListener(t, e => e.stopPropagation()));
rib.addEventListener('animationend', () => rib.classList.remove('show'));
rib.onclick = () => { if(rib.dataset.go && rib.classList.contains('show')){ rib.classList.remove('show'); SND.play('tap'); startLevel(+rib.dataset.go); } };
function ribbon(txt, go){ const r = rib; r.dataset.go = go ?? ''; r.innerHTML = UNLOCK + txt + (go != null ? '<b>Play ›</b>' : ''); setTimeout(() => SND.play('unlock'), 350); r.classList.remove('show'); void r.offsetWidth; r.classList.add('show'); }
function showDone(){
  if(!run) return;
  const last = run.i === LEVELS.length-1;
  $('#doneT').textContent = 'Gold star!';
  $('#doneSub').textContent = last ? 'All 15 found in the final scene!' : 'All 15 found';
  $('#doneHearts').innerHTML = hearts(run.hearts);
  $('#dNext').style.display = last ? 'none' : '';
  $('#done').classList.add('on'); SND.play('star');
}

/* --- found ring --- */
function drawRing(t){
  const r = t.s*.62, n = 40, a0 = Math.random()*6.28, sd = Math.random()*9; let d = '';
  for(let j=0;j<=n+5;j++){ const a = a0 + j/n*Math.PI*2, q = r*(1 + .05*Math.sin(j*.8+sd) + j/(n+5)*.07); d += (j?'L':'M') + n1(t.x+Math.cos(a)*q) + ' ' + n1(t.y+Math.sin(a)*q*.94); }
  const w = Math.max(4, t.s*.075);
  rings.insertAdjacentHTML('beforeend', `<path d="${d}" class="rg0" stroke-width="${n1(w+6)}"/><path d="${d}" class="rg1" stroke-width="${n1(w)}"/>`);
  [...rings.children].slice(-2).forEach(p => {
    let len = 2000; try{ len = p.getTotalLength(); }catch(_){}
    p.style.strokeDasharray = len; p.style.strokeDashoffset = len; p.getBoundingClientRect();
    p.style.transition = 'stroke-dashoffset .5s ease-out'; p.style.strokeDashoffset = 0;
  });
}

/* --- sparkles / miss marks on the fx canvas --- */
const parts = []; let fxRaf = 0;
const SPK = ['#ffd43b','#ffffff','#ff7ab6','#7fe3ff','#ffe9a0'];
function burst(wx, wy, s){
  const now = performance.now();
  for(let q=0;q<34;q++){ const a = Math.random()*6.28, sp = 2.5 + Math.random()*5.5; parts.push({k:'s', wx, wy, dx:0, dy:0, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, t0:now, life:700+Math.random()*600, sz:5+Math.random()*9, col:SPK[q%5], rot:Math.random()*6, vr:(Math.random()-.5)*.3}); }
  for(let q=0;q<6;q++) parts.push({k:'t', wx, wy, ox:(Math.random()-.5)*s*1.4, oy:(Math.random()-.5)*s*1.4, t0:now+q*120, life:900, sz:8+Math.random()*8});
  parts.push({k:'o', wx, wy, t0:now, life:550, r0:s*.45});
  loopFx();
}
function missFx(wx, wy){ parts.push({k:'x', wx, wy, t0:performance.now(), life:700}); loopFx(); }
function loopFx(){ if(!fxRaf) fxRaf = requestAnimationFrame(drawFx); }
function star4(x, y, s, rot, col){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.beginPath();
  ctx.moveTo(0,-s); ctx.quadraticCurveTo(0,0,s,0); ctx.quadraticCurveTo(0,0,0,s); ctx.quadraticCurveTo(0,0,-s,0); ctx.quadraticCurveTo(0,0,0,-s);
  ctx.fillStyle = col; ctx.fill(); ctx.restore();
}
function drawFx(now){
  fxRaf = 0;
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,vw,vh);
  for(let q=parts.length-1;q>=0;q--){
    const p = parts[q], t = (now-p.t0)/p.life;
    if(t >= 1){ parts.splice(q,1); continue; }
    if(t < 0) continue;
    const sx = p.wx*view.s + view.tx, sy = p.wy*view.s + view.ty;
    if(p.k === 's'){
      p.vx *= .95; p.vy *= .95; p.vy += .05; p.dx += p.vx; p.dy += p.vy; p.rot += p.vr;
      ctx.globalAlpha = 1 - t*t; star4(sx+p.dx, sy+p.dy, p.sz*(1-t*.5), p.rot, p.col);
    } else if(p.k === 't'){
      ctx.globalAlpha = Math.sin(t*Math.PI); star4(sx+p.ox*view.s, sy+p.oy*view.s, p.sz*Math.sin(t*Math.PI), 0, '#fff');
    } else if(p.k === 'o'){
      ctx.globalAlpha = 1-t; ctx.strokeStyle = '#fff'; ctx.lineWidth = 5*(1-t);
      ctx.beginPath(); ctx.arc(sx, sy, p.r0*view.s + t*70, 0, 6.3); ctx.stroke();
    } else if(p.k === 'x'){
      const sc = 14*(.6 + .4*Math.min(1,t*5)); ctx.globalAlpha = t < .6 ? 1 : (1-t)/.4;
      ctx.lineCap = 'round';
      for(const [w,c] of [[11,'#fff'],[6,'#ff2e55']]){ ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(sx-sc,sy-sc); ctx.lineTo(sx+sc,sy+sc); ctx.moveTo(sx+sc,sy-sc); ctx.lineTo(sx-sc,sy+sc); ctx.stroke(); }
    }
  }
  ctx.globalAlpha = 1;
  if(parts.length) fxRaf = requestAnimationFrame(drawFx);
}

/* --- tutorial --- */
const TSTEPS = [
  {t:'Every picture hides 15 things. Your list of things to find is at the bottom.', btn:'Next'},
  {t: coarse ? 'Pinch with two fingers to zoom in.' : 'Scroll your mouse wheel, or press +, to zoom in.', ic:'pinch', ok:() => view.s > fitS*1.7},
  {t: coarse ? 'Now drag with one finger to look around.' : 'Now drag to look around.', ic:'drag', ok:() => panTotal > 160, init:() => { panTotal = 0; }},
  {t:'Spot the rubber duck and tap it!', hl:'duck', ok:() => run.targets.find(x => x.id === 'duck').found},
  {t:'Tapping where nothing is hidden costs a heart. Try it: tap an empty spot.', ok:() => run.tmiss, init:() => { run.tmiss = false; run.hearts = 3; updateHearts(); }},
  {t:'Lost hearts show on the level map, but you can always keep looking. Now find the apple and the star.', ok:() => run.found >= 3},
  {t:'Find 10 things to unlock the next picture. Find all 15 for a gold star!', btn:"Let's go!", end:true}
];
let tstep = 0;
function tutStart(){ tstep = 0; tutShow(); }
function tutShow(){
  const s = TSTEPS[tstep];
  if(s.init) s.init();
  $('#ctext').textContent = s.t;
  $('#cicon').className = 'cicon ' + (s.ic || '');
  $('#cbtn').style.display = s.btn ? '' : 'none';
  $('#cbtn').textContent = s.btn || '';
  document.querySelectorAll('.ti').forEach(el => el.classList.toggle('hl', el.dataset.id === s.hl && !el.classList.contains('got')));
  tutCheck();
}
function tutCheck(){
  if(!run || !run.tut) return;
  const s = TSTEPS[tstep];
  if(s && s.ok && s.ok()){ tstep++; tutShow(); }
}
$('#cbtn').onclick = () => { const s = TSTEPS[tstep]; if(s.end){ prog.tut = 1; save(); goLevels(); } else { tstep++; tutShow(); } };
$('#cskip').onclick = () => { prog.tut = 1; save(); goLevels(); };

</script>

        async src="//gc.zgo.at/count.js"></script>
